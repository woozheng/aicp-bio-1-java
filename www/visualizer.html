<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AICP · Envelop Flow</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        html,body{height:100%;overflow:hidden}
        body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg, #0f0c29, #302b63, #24243e);color:#e0e0e0;display:flex;flex-direction:column}

        .navbar{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:rgba(15,15,30,0.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;z-index:10;min-height:44px}
        .nav-logo{font-size:16px;font-weight:bold;color:#e94560;white-space:nowrap;display:flex;align-items:center;gap:8px}
        .nav-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
        .nav-actions button{padding:3px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.12);background:transparent;color:#e0e0e0;cursor:pointer;font-size:11px;transition:all 0.2s;font-family:inherit;white-space:nowrap}
        .nav-actions button:hover{border-color:#e94560;color:#e94560}
        .nav-actions button.active{background:rgba(233,69,96,0.18);border-color:#e94560;color:#e94560}
        .nav-actions .badge{background:#e9456020;color:#e94560;padding:2px 8px;border-radius:4px;font-size:9px;border:1px solid #e9456040}

        .main{flex:1;display:flex;overflow:hidden;position:relative;min-height:0}

        .sidebar{width:180px;background:rgba(15,15,30,0.85);backdrop-filter:blur(10px);border-right:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;flex-shrink:0;padding-top:12px;z-index:5;overflow-y:auto}
        .sidebar .nav-group{margin-bottom:4px}
        .sidebar .nav-group-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:#555;padding:6px 16px 4px}
        .sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:8px 16px;margin:2px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:#888;transition:0.2s;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .sidebar .nav-item:hover{background:rgba(233,69,96,0.12);color:#fff}
        .sidebar .nav-item.active{background:rgba(233,69,96,0.18);color:#e94560;font-weight:600}
        .sidebar .nav-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
        .sidebar .divider{height:1px;background:rgba(255,255,255,0.06);margin:8px 16px}

        .content{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0;position:relative}

        .canvas-wrap{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 50%, rgba(48,43,99,0.4), rgba(15,12,41,0.9))}
        #flowCanvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}

        .footer-bar{display:flex;align-items:center;gap:10px;padding:4px 14px;background:rgba(15,15,30,0.92);backdrop-filter:blur(10px);border-top:1px solid rgba(255,255,255,0.04);flex-shrink:0;height:30px;font-size:10px;color:#777;overflow-x:auto}
        .footer-bar .spacer{flex:1}
        .footer-bar .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle}
        .footer-bar .dot.green{background:#10b981;box-shadow:0 0 8px #10b981}
        .footer-bar .dot.red{background:#ef4444;box-shadow:0 0 8px #ef4444}
        .footer-bar .dot.gray{background:#555}
        .footer-bar .stat{display:inline-flex;align-items:center;gap:4px}
        .footer-bar .stat b{color:#e94560;font-weight:600}

        .panel-right{width:240px;background:rgba(15,15,30,0.85);backdrop-filter:blur(10px);border-left:1px solid rgba(255,255,255,0.06);display:flex;flex-direction:column;flex-shrink:0;padding:14px 12px;gap:12px;overflow-y:auto}
        .panel-section{display:flex;flex-direction:column;gap:6px}
        .panel-section-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.6px;color:#555}
        .panel-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:#888;gap:8px}
        .panel-row .val{color:#e0e0e0;font-weight:500;font-family:monospace}

        .legend-item{display:flex;align-items:center;gap:8px;font-size:11px;color:#888}
        .legend-item .swatch{width:12px;height:2px;border-radius:2px;flex-shrink:0}
        .legend-item .swatch.gw{background:#3b82f6;height:3px;box-shadow:0 0 6px #3b82f6}
        .legend-item .swatch.sync{background:#e94560;height:2px;box-shadow:0 0 4px #e94560}
        .legend-item .swatch.async{background:#f59e0b;height:2px;box-shadow:0 0 4px #f59e0b}
        .legend-item .swatch.return{background:#10b981;height:2px;box-shadow:0 0 4px #10b981}
        .legend-item .dotnode{width:10px;height:10px;border-radius:50%;flex-shrink:0}
        .legend-item .dotnode.gateway{background:#3b82f6;box-shadow:0 0 8px #3b82f6}
        .legend-item .dotnode.wsgateway{background:#a855f7;box-shadow:0 0 8px #a855f7}
        .legend-item .dotnode.plugin{background:#e94560;box-shadow:0 0 6px #e94560}

        .node-detail{position:absolute;background:rgba(20,20,40,0.96);border:1px solid rgba(233,69,96,0.3);border-radius:8px;padding:10px 14px;font-size:11px;color:#e0e0e0;pointer-events:none;opacity:0;transition:opacity 0.15s;z-index:100;box-shadow:0 8px 30px rgba(0,0,0,0.6);max-width:280px}
        .node-detail.show{opacity:1}
        .node-detail .nd-id{color:#e94560;font-family:monospace;font-size:12px;font-weight:600;margin-bottom:4px;word-break:break-all}
        .node-detail .nd-row{display:flex;justify-content:space-between;gap:12px;font-size:10px;color:#888;line-height:1.6}
        .node-detail .nd-row b{color:#e0e0e0;font-weight:500}

        .canvas-hint{position:absolute;bottom:14px;left:14px;font-size:10px;color:#555;background:rgba(15,15,30,0.7);padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);pointer-events:none;line-height:1.6}

        .stats-overlay{position:absolute;top:14px;left:14px;display:flex;gap:8px;pointer-events:none}
        .stat-card{background:rgba(15,15,30,0.75);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:8px 14px;text-align:center;min-width:80px}
        .stat-card .num{font-size:18px;font-weight:700;color:#e94560;font-family:monospace;line-height:1.2}
        .stat-card .lbl{font-size:9px;color:#666;text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}

        @media(max-width:768px){
            .sidebar{position:fixed;bottom:0;left:0;right:0;width:100%;height:52px;flex-direction:row;padding:0;border-right:none;border-top:1px solid rgba(255,255,255,0.06);background:rgba(15,15,30,0.92);backdrop-filter:blur(12px);z-index:20;justify-content:space-around;align-items:center;overflow-x:auto}
            .sidebar .nav-group{display:flex;gap:2px;margin:0;flex:1;justify-content:space-around}
            .sidebar .nav-group-label{display:none}
            .sidebar .nav-item{flex-direction:column;padding:4px 6px;margin:0;font-size:9px;gap:1px;border-radius:6px;flex:1;justify-content:center;align-items:center;min-height:44px}
            .sidebar .nav-item .icon{font-size:18px;width:auto;margin:0}
            .sidebar .nav-item span{font-size:8px;display:block}
            .sidebar .divider{display:none}
            .content{padding-bottom:56px}
            .panel-right{display:none}
            .stats-overlay{top:8px;left:8px;gap:6px}
            .stat-card{padding:6px 10px;min-width:60px}
            .stat-card .num{font-size:14px}
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-logo">🌊 AICP<span> Envelop Flow</span></div>
    <div class="nav-actions">
        <button id="btnPause" onclick="togglePause()">⏸ 暂停</button>
        <button id="btnClear" onclick="clearAll()">🗑 清空</button>
        <button id="btnLabels" class="active" onclick="toggleLabels()">🏷 标签</button>
        <span class="badge" id="wsBadge">连接中</span>
    </div>
</nav>

<div class="main">
    <div class="sidebar">
        <div class="nav-group">
            <div class="nav-group-label">视图</div>
            <div class="nav-item active" data-view="all" onclick="switchView('all')">
                <span class="icon">🌐</span><span>全部</span>
            </div>
            <div class="nav-item" data-view="business" onclick="switchView('business')">
                <span class="icon">💼</span><span>业务</span>
            </div>
            <div class="nav-item" data-view="hot" onclick="switchView('hot')">
                <span class="icon">🔥</span><span>热点</span>
            </div>
        </div>
        <div class="divider"></div>
        <div class="nav-group">
            <div class="nav-group-label">操作</div>
            <div class="nav-item" onclick="resetView()">
                <span class="icon">🎯</span><span>重置视角</span>
            </div>
        </div>
    </div>

    <div class="content">
        <div class="canvas-wrap" id="canvasWrap">
            <canvas id="flowCanvas"></canvas>

            <div class="stats-overlay">
                <div class="stat-card">
                    <div class="num" id="statParticles">0</div>
                    <div class="lbl">在飞</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="statNodes">0</div>
                    <div class="lbl">节点</div>
                </div>
                <div class="stat-card">
                    <div class="num" id="statRate">0</div>
                    <div class="lbl">/秒</div>
                </div>
            </div>

            <div class="node-detail" id="nodeDetail"></div>
            <div class="canvas-hint">拖动节点 · 悬停查看</div>
        </div>

        <div class="footer-bar">
            <span id="wsStatus"><span class="dot red"></span>未连接</span>
            <span class="spacer"></span>
            <span class="stat">频道 <b id="channelName">pa_visualizer</b></span>
            <span class="stat">帧 <b id="fpsCounter">0</b> fps</span>
        </div>
    </div>

    <div class="panel-right">
        <div class="panel-section">
            <div class="panel-section-title">图例</div>
            <div class="legend-item"><span class="dotnode gateway"></span> HTTP 网关（入口）</div>
            <div class="legend-item"><span class="dotnode wsgateway"></span> WS 网关（出口）</div>
            <div class="legend-item"><span class="dotnode plugin"></span> 插件（动态）</div>
            <div class="legend-item" style="margin-top:6px;"><span class="swatch gw"></span> 网关转发（out）</div>
            <div class="legend-item"><span class="swatch sync"></span> 同步调用（out）</div>
            <div class="legend-item"><span class="swatch async"></span> 异步 / 回调（out）</div>
            <div class="legend-item"><span class="swatch return"></span> 返回（in）</div>
        </div>

        <div class="panel-section">
            <div class="panel-section-title">节点</div>
            <div class="panel-row"><span>总节点</span><span class="val" id="pTotalNodes">0</span></div>
            <div class="panel-row"><span>活跃节点</span><span class="val" id="pActiveNodes">0</span></div>
            <div class="panel-row"><span>最大流量</span><span class="val" id="pMaxFlow">0</span></div>
        </div>

        <div class="panel-section">
            <div class="panel-section-title">Top 节点</div>
            <div id="topNodes" style="font-family:monospace;font-size:10px;color:#888;line-height:1.7;max-height:180px;overflow-y:auto;"></div>
        </div>

        <div class="panel-section">
            <div class="panel-section-title">最近事件</div>
            <div id="recentEvents" style="font-family:monospace;font-size:10px;color:#888;line-height:1.7;max-height:200px;overflow-y:auto;"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 配置
// ============================================================
var getSessionId = function() {
    var match = document.cookie.match(/aicp_token=([^;]+)/);
    return match ? match[1] : 'default';
};
var SESSION_ID = getSessionId();
var CHANNEL = 'pa_visualizer';

// ============================================================
// 状态
// ============================================================
var nodes = {};
var particles = [];
var links = {};
var paused = false;
var showLabels = true;
var currentView = 'all';
var eventRate = { count: 0, lastReset: Date.now(), rate: 0 };
var recentEvents = [];
var hotNodes = {};

var CHANNEL_PLUGINS = [
    'os/_websocket',
    'builtins/notify/ws',
    'os/_visualizer',
];

// ============================================================
// Canvas
// ============================================================
var canvas = document.getElementById('flowCanvas');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

function resize() {
    var wrap = document.getElementById('canvasWrap');
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    bootstrapNodes();
}
window.addEventListener('resize', resize);

// ============================================================
// 启动节点：钉住两个网关
// ============================================================
function bootstrapNodes() {
    // HTTP 网关（入口） — 左侧
    var gateway = ensureNode('os/_gateway');
    gateway.type = 'gateway';
    gateway.x = W / 2 - 110;
    gateway.y = H / 2;
    gateway.pinned = true;
    gateway.alpha = 1;

    // WebSocket 网关（出口） — 右侧
    var wsGateway = ensureNode('os/_websocket');
    wsGateway.type = 'wsgateway';
    wsGateway.x = W / 2 + 110;
    wsGateway.y = H / 2;
    wsGateway.pinned = true;
    wsGateway.alpha = 1;
}

// ============================================================
// 节点类型推断
// ============================================================
function classifyNode(id) {
    if (!id) return 'plugin';
    if (id === 'os/_websocket') return 'wsgateway';
    if (id.indexOf('gateway') !== -1) return 'gateway';
    return 'plugin';
}

function nodeColor(type) {
    if (type === 'gateway') return '#3b82f6';
    if (type === 'wsgateway') return '#a855f7';
    return '#e94560';
}

// ============================================================
// 节点管理
// ============================================================
function ensureNode(id, type) {
    if (!nodes[id]) {
        var angle = Math.random() * Math.PI * 2;
        var radius = Math.min(W, H) * 0.3;
        nodes[id] = {
            id: id,
            x: W / 2 + Math.cos(angle) * radius,
            y: H / 2 + Math.sin(angle) * radius,
            vx: 0, vy: 0,
            count: 0,
            lastActive: Date.now(),
            type: type || classifyNode(id),
            born: Date.now(),
            alpha: 1.0,
            pinned: false,
        };
    }
    return nodes[id];
}

// ============================================================
// 过滤
// ============================================================
function shouldSkipChannel(id) {
    for (var i = 0; i < CHANNEL_PLUGINS.length; i++) {
        if (id.indexOf(CHANNEL_PLUGINS[i]) !== -1) return true;
    }
    return false;
}

function shouldSkipNode(id) {
    var n = nodes[id];
    if (n && n.pinned) return false;
    if (currentView === 'business') return shouldSkipChannel(id);
    if (currentView === 'hot') return !hotNodes[id];
    return false;
}

function shouldSkipEdge(from, to) {
    var a = nodes[from], b = nodes[to];
    if (a && a.pinned) return false;
    if (b && b.pinned) return false;
    if (currentView === 'business') {
        return shouldSkipChannel(from) || shouldSkipChannel(to);
    }
    if (currentView === 'hot') {
        return !hotNodes[from] && !hotNodes[to];
    }
    return false;
}

// ============================================================
// 处理 Envelop 事件
// ============================================================
function handleEnvelop(evt) {
    if (paused) return;

    var from = evt.sender || 'unknown';
    var to = evt.receiver || 'unknown';
    var intent = evt.intent || '';
    var direction = evt.direction || 'out';

    // 可视化自身的事件不再触发新粒子
    if (from === 'os/_visualizer') return;

    // ★ 根据 direction 决定粒子方向
    var particleFrom = direction === 'in' ? to : from;
    var particleTo = direction === 'in' ? from : to;

    var fromNode = ensureNode(from);
    var toNode = ensureNode(to);

    fromNode.count++;
    fromNode.lastActive = Date.now();
    toNode.lastActive = Date.now();

    var linkKey = from + '|' + to;
    if (!links[linkKey]) {
        links[linkKey] = { count: 0, lastActive: Date.now(), kind: 'sync' };
    }
    links[linkKey].count++;
    links[linkKey].lastActive = Date.now();

    var isGateway = from.indexOf('gateway') !== -1 || to.indexOf('gateway') !== -1;
    var isWsGateway = from === 'os/_websocket' || to === 'os/_websocket';
    var isAsync = intent === 'CALLBACK' || intent === 'ASYNC' || (evt.has_response === false);

    if (isGateway) links[linkKey].kind = 'gateway';
    else if (isAsync) links[linkKey].kind = 'async';

    // ★ 返回用绿色；出口网关用紫色
    var color;
    if (direction === 'in') {
        color = '#10b981';
    } else if (isWsGateway) {
        color = '#a855f7';
    } else if (isGateway) {
        color = '#3b82f6';
    } else if (isAsync) {
        color = '#f59e0b';
    } else {
        color = '#e94560';
    }

    particles.push({
        from: particleFrom,
        to: particleTo,
        progress: 0,
        speed: 0.018 + Math.random() * 0.012,
        color: color,
        width: direction === 'in' ? 1.5 : (isWsGateway ? 3.5 : (isGateway ? 3 : 2)),
        dashed: isAsync,
        kind: direction === 'in' ? 'return' : (isWsGateway ? 'wsgateway' : (isGateway ? 'gateway' : (isAsync ? 'async' : 'sync'))),
        born: Date.now(),
    });

    eventRate.count++;

    recentEvents.unshift({
        from: from,
        to: to,
        intent: intent,
        ts: Date.now(),
        direction: direction,
        kind: direction === 'in' ? 'return' : (isWsGateway ? 'wsgateway' : (isGateway ? 'gateway' : (isAsync ? 'async' : 'sync'))),
    });
    if (recentEvents.length > 8) recentEvents.pop();
    renderRecentEvents();
}

// ============================================================
// 物理模拟
// ============================================================
function simulate(dt) {
    var ids = Object.keys(nodes);
    var cx = W / 2, cy = H / 2;

    for (var i = 0; i < ids.length; i++) {
        var a = nodes[ids[i]];
        for (var j = i + 1; j < ids.length; j++) {
            var b = nodes[ids[j]];
            var dx = b.x - a.x;
            var dy = b.y - a.y;
            var d2 = dx * dx + dy * dy + 0.01;
            var d = Math.sqrt(d2);
            var force = 12000 / d2;
            var fx = (dx / d) * force;
            var fy = (dy / d) * force;
            if (!a.pinned) { a.vx -= fx; a.vy -= fy; }
            if (!b.pinned) { b.vx += fx; b.vy += fy; }
        }
    }

    for (var k = 0; k < ids.length; k++) {
        var n = nodes[ids[k]];
        if (n.pinned) continue;
        var dx2 = cx - n.x;
        var dy2 = cy - n.y;
        n.vx += dx2 * 0.0008;
        n.vy += dy2 * 0.0008;
    }

    for (var key in links) {
        var parts = key.split('|');
        var na = nodes[parts[0]];
        var nb = nodes[parts[1]];
        if (!na || !nb) continue;
        var lx = nb.x - na.x;
        var ly = nb.y - na.y;
        var ld = Math.sqrt(lx * lx + ly * ly) + 0.01;
        var targetLen = 140;
        var diff = (ld - targetLen) * 0.005;
        var lfx = (lx / ld) * diff;
        var lfy = (ly / ld) * diff;
        if (!na.pinned) { na.vx += lfx; na.vy += lfy; }
        if (!nb.pinned) { nb.vx -= lfx; nb.vy -= lfy; }
    }

    for (var m = 0; m < ids.length; m++) {
        var node = nodes[ids[m]];
        if (node.pinned) {
            node.alpha = 1;
            continue;
        }
        node.vx *= 0.85;
        node.vy *= 0.85;
        node.x += node.vx;
        node.y += node.vy;

        var pad = 30;
        if (node.x < pad) { node.x = pad; node.vx *= -0.3; }
        if (node.x > W - pad) { node.x = W - pad; node.vx *= -0.3; }
        if (node.y < pad) { node.y = pad; node.vy *= -0.3; }
        if (node.y > H - pad) { node.y = H - pad; node.vy *= -0.3; }

        var age = (Date.now() - node.lastActive) / 1000;
        if (age > 30) {
            node.alpha = Math.max(0.15, 1 - (age - 30) / 60);
        } else {
            node.alpha = Math.min(1, node.alpha + 0.05);
        }
    }
}

// ============================================================
// 绘制
// ============================================================
function draw() {
    ctx.fillStyle = 'rgba(15, 12, 41, 0.35)';
    ctx.fillRect(0, 0, W, H);

    var ids = Object.keys(nodes);

    for (var key in links) {
        var parts = key.split('|');
        var a = nodes[parts[0]];
        var b = nodes[parts[1]];
        if (!a || !b) continue;

        if (shouldSkipEdge(parts[0], parts[1])) continue;

        var link = links[key];
        var age = (Date.now() - link.lastActive) / 1000;
        var linkAlpha = Math.max(0.05, 1 - age / 30);
        var width = Math.min(3, 0.5 + Math.log(1 + link.count) * 0.5);

        ctx.save();
        ctx.globalAlpha = linkAlpha * 0.35;
        ctx.strokeStyle = link.kind === 'gateway' ? '#3b82f6' : (link.kind === 'async' ? '#f59e0b' : '#e94560');
        ctx.lineWidth = width;
        if (link.kind === 'async') ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.restore();
    }

    for (var i = particles.length - 1; i >= 0; i--) {
        var p = particles[i];
        var fromNode = nodes[p.from];
        var toNode = nodes[p.to];
        if (!fromNode || !toNode) {
            particles.splice(i, 1);
            continue;
        }

        if (shouldSkipEdge(p.from, p.to)) {
            particles.splice(i, 1);
            continue;
        }

        p.progress += p.speed;
        if (p.progress >= 1) {
            particles.splice(i, 1);
            continue;
        }

        var px = fromNode.x + (toNode.x - fromNode.x) * p.progress;
        var py = fromNode.y + (toNode.y - fromNode.y) * p.progress;

        var glow = ctx.createRadialGradient(px, py, 0, px, py, 12);
        glow.addColorStop(0, p.color);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.save();
        ctx.globalAlpha = 0.5 * (1 - p.progress * 0.3);
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(px, py, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 1 - p.progress * 0.3;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(px, py, p.width + 1, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.3 * (1 - p.progress);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = p.width;
        ctx.beginPath();
        var tailProgress = Math.max(0, p.progress - 0.08);
        var tx = fromNode.x + (toNode.x - fromNode.x) * tailProgress;
        var ty = fromNode.y + (toNode.y - fromNode.y) * tailProgress;
        ctx.moveTo(tx, ty);
        ctx.lineTo(px, py);
        ctx.stroke();
        ctx.restore();
    }

    for (var j = 0; j < ids.length; j++) {
        var n = nodes[ids[j]];
        if (shouldSkipNode(n.id)) continue;

        var r = (n.type === 'gateway' || n.type === 'wsgateway') ? 14 : 10;
        var color = nodeColor(n.type);

        var halo = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, r * 3);
        halo.addColorStop(0, hexA(color, 0.4 * n.alpha));
        halo.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.save();
        ctx.globalAlpha = n.alpha;
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r * 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.beginPath();
        ctx.arc(n.x, n.y, r * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        if (showLabels) {
            var shortName = n.id;
            if (shortName.length > 28) shortName = shortName.slice(0, 26) + '…';
            ctx.save();
            ctx.globalAlpha = n.alpha * 0.9;
            ctx.font = '10px -apple-system, monospace';
            ctx.fillStyle = '#c0c0d0';
            ctx.textAlign = 'center';
            ctx.fillText(shortName, n.x, n.y + r + 14);
            ctx.restore();
        }
    }
}

function hexA(hex, a) {
    var r = parseInt(hex.slice(1, 3), 16);
    var g = parseInt(hex.slice(3, 5), 16);
    var b = parseInt(hex.slice(5, 7), 16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

// ============================================================
// 主循环
// ============================================================
var lastFrame = Date.now();
var frameCount = 0;
var fpsTime = Date.now();

function loop() {
    var now = Date.now();
    var dt = now - lastFrame;
    lastFrame = now;

    if (!paused) {
        simulate(dt);
        draw();
    }

    frameCount++;
    if (now - fpsTime > 1000) {
        document.getElementById('fpsCounter').textContent = frameCount;
        frameCount = 0;
        fpsTime = now;
    }

    if (now - eventRate.lastReset > 1000) {
        eventRate.rate = eventRate.count;
        eventRate.count = 0;
        eventRate.lastReset = now;
        document.getElementById('statRate').textContent = eventRate.rate;
    }

    document.getElementById('statParticles').textContent = particles.length;
    document.getElementById('statNodes').textContent = Object.keys(nodes).length;

    requestAnimationFrame(loop);
}

// ============================================================
// WebSocket（对齐 index.html 的连接方式）
// ============================================================
var ws = null;
var wsHeartbeat = null;
var reconnectDelay = 3000;
var reconnectTimer = null;

function connectWS() {
    var wsChannel = CHANNEL;
    fetch('/api/ws_config').then(function(r) { return r.json(); }).then(function(data) {
        var url = data.url || 'ws://' + location.hostname + ':' + (parseInt(location.port || 9000) + 1) + '/ws';
        ws = new WebSocket(url + '?channel=' + wsChannel);

        ws.onopen = function() {
            document.getElementById('wsBadge').textContent = '已连接';
            document.getElementById('wsBadge').style.color = '#10b981';
            document.getElementById('wsStatus').innerHTML = '<span class="dot green"></span>已连接';
            updatePanelStats();

            reconnectDelay = 3000;

            if (wsHeartbeat) clearInterval(wsHeartbeat);
            wsHeartbeat = setInterval(function() {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'ping' }));
                }
            }, 15000);
        };

        ws.onmessage = function(e) {
            try {
                var msg = JSON.parse(e.data);
                if (msg.type === 'pong') return;
                var data = msg.data || msg;
                if (data.type === 'envelop') {
                    handleEnvelop(data);
                }
            } catch(err) {}
        };

        ws.onclose = function() {
            document.getElementById('wsBadge').textContent = '重连中';
            document.getElementById('wsBadge').style.color = '#f59e0b';
            document.getElementById('wsStatus').innerHTML = '<span class="dot red"></span>已断开';

            if (wsHeartbeat) { clearInterval(wsHeartbeat); wsHeartbeat = null; }
            if (reconnectTimer) clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(connectWS, reconnectDelay);
            if (reconnectDelay < 30000) reconnectDelay = Math.min(reconnectDelay * 1.5, 30000);
        };

        ws.onerror = function() {};
    }).catch(function() {
        if (reconnectTimer) clearTimeout(reconnectTimer);
        reconnectTimer = setTimeout(connectWS, reconnectDelay);
    });
}

// ============================================================
// 面板
// ============================================================
function updatePanelStats() {
    var ids = Object.keys(nodes);
    var now = Date.now();
    var active = 0;
    var maxFlow = 0;

    ids.forEach(function(id) {
        var n = nodes[id];
        if (now - n.lastActive < 15000) active++;
        if (n.count > maxFlow) maxFlow = n.count;
    });

    var sorted = ids.slice().sort(function(a, b) {
        return nodes[b].count - nodes[a].count;
    });
    hotNodes = {};
    sorted.slice(0, 10).forEach(function(id) {
        hotNodes[id] = true;
    });

    document.getElementById('pTotalNodes').textContent = ids.length;
    document.getElementById('pActiveNodes').textContent = active;
    document.getElementById('pMaxFlow').textContent = maxFlow;

    renderTopNodes();
}

function renderTopNodes() {
    var box = document.getElementById('topNodes');
    if (!box) return;
    var ids = Object.keys(nodes);
    var sorted = ids.slice().sort(function(a, b) {
        return nodes[b].count - nodes[a].count;
    }).slice(0, 10);

    var html = '';
    sorted.forEach(function(id, idx) {
        var n = nodes[id];
        var rank = (idx + 1) + '.';
        var shortId = id.length > 24 ? '…' + id.slice(-22) : id;
        html += '<div>' + rank + ' ' + shortId + ' <span style="color:#e94560">' + n.count + '</span></div>';
    });
    box.innerHTML = html || '<div style="color:#555">暂无数据</div>';
}

function renderRecentEvents() {
    var box = document.getElementById('recentEvents');
    var html = '';
    recentEvents.forEach(function(ev) {
        var time = new Date(ev.ts).toLocaleTimeString('zh-CN', { hour12: false });
        var color;
        if (ev.kind === 'return') color = '#10b981';
        else if (ev.kind === 'wsgateway') color = '#a855f7';
        else if (ev.kind === 'gateway') color = '#3b82f6';
        else if (ev.kind === 'async') color = '#f59e0b';
        else color = '#e94560';

        var arrow;
        if (ev.direction === 'in') arrow = '←';
        else if (ev.kind === 'gateway') arrow = '⇢';
        else arrow = '→';

        var fromShort = ev.from.length > 18 ? '…' + ev.from.slice(-16) : ev.from;
        var toShort = ev.to.length > 18 ? '…' + ev.to.slice(-16) : ev.to;
        html += '<div style="color:' + color + '">' + time + ' ' + arrow + ' ' + fromShort + ' → ' + toShort + '</div>';
    });
    box.innerHTML = html || '<div style="color:#555">暂无事件</div>';
}

setInterval(updatePanelStats, 1000);

// ============================================================
// 交互
// ============================================================
function togglePause() {
    paused = !paused;
    document.getElementById('btnPause').textContent = paused ? '▶ 继续' : '⏸ 暂停';
    document.getElementById('btnPause').classList.toggle('active', paused);
}

function clearAll() {
    nodes = {};
    particles = [];
    links = {};
    recentEvents = [];
    hotNodes = {};
    renderRecentEvents();
    ctx.clearRect(0, 0, W, H);
    bootstrapNodes();
}

function toggleLabels() {
    showLabels = !showLabels;
    document.getElementById('btnLabels').classList.toggle('active', showLabels);
}

function switchView(view) {
    currentView = view;
    document.querySelectorAll('.sidebar .nav-item[data-view]').forEach(function(el) {
        el.classList.remove('active');
    });
    var el = document.querySelector('.sidebar .nav-item[data-view="' + view + '"]');
    if (el) el.classList.add('active');
}

function resetView() {
    Object.keys(nodes).forEach(function(id) {
        var n = nodes[id];
        if (n.pinned) return;
        var angle = Math.random() * Math.PI * 2;
        var radius = Math.min(W, H) * 0.3;
        n.x = W / 2 + Math.cos(angle) * radius;
        n.y = H / 2 + Math.sin(angle) * radius;
        n.vx = 0;
        n.vy = 0;
    });
    particles = [];
}

// ============================================================
// 节点悬停
// ============================================================
canvas.addEventListener('mousemove', function(e) {
    var rect = canvas.getBoundingClientRect();
    var mx = e.clientX - rect.left;
    var my = e.clientY - rect.top;

    var hovered = null;
    for (var id in nodes) {
        var n = nodes[id];
        if (shouldSkipNode(id)) continue;
        var dx = mx - n.x;
        var dy = my - n.y;
        if (dx * dx + dy * dy < 20 * 20) {
            hovered = n;
            break;
        }
    }

    var detail = document.getElementById('nodeDetail');
    if (hovered) {
        var age = ((Date.now() - hovered.lastActive) / 1000).toFixed(1);
        detail.innerHTML =
            '<div class="nd-id">' + hovered.id + '</div>' +
            '<div class="nd-row"><span>类型</span><b>' + hovered.type + '</b></div>' +
            '<div class="nd-row"><span>事件数</span><b>' + hovered.count + '</b></div>' +
            '<div class="nd-row"><span>最近活跃</span><b>' + age + 's 前</b></div>';
        detail.style.left = (mx + 16) + 'px';
        detail.style.top = (my + 16) + 'px';
        detail.classList.add('show');
    } else {
        detail.classList.remove('show');
    }
});

canvas.addEventListener('mouseleave', function() {
    document.getElementById('nodeDetail').classList.remove('show');
});

// ============================================================
// Toast
// ============================================================
var _toastTimer = null;
function showToast(msg) {
    var t = document.querySelector('.toast');
    if (!t) {
        t = document.createElement('div');
        t.className = 'toast';
        t.style.cssText = 'position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#1a1a2e;color:#e0e0e0;padding:5px 16px;border-radius:20px;font-size:12px;z-index:2000;opacity:1;transition:opacity 0.3s;border:1px solid rgba(255,255,255,0.06);pointer-events:none;';
        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.style.opacity = '1';
    if (_toastTimer) clearTimeout(_toastTimer);
    _toastTimer = setTimeout(function() { t.style.opacity = '0'; }, 2000);
}

// ============================================================
// 启动
// ============================================================
resize();
connectWS();
requestAnimationFrame(loop);
</script>
